[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floor-tase-handoff"
version = "0.6.1"
description = "Reproducible research prototype for joint rework and recertification scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2,<3", "matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
gpu = ["torch>=2.6,<3"]

[project.scripts]
floor-tase = "floor_tase.cli:main"
